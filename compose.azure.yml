services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: bridge
    volumes:
      - bridge_azure_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_DRIVER: postgresql+asyncpg
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bridge
      DB_USER: bridge
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: '["https://${BRIDGE_DOMAIN:?Set BRIDGE_DOMAIN in .env}"]'
      PUBLIC_URL: https://${BRIDGE_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      MAIL_MODE: smtp
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set a Google App Password in .env}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
      SMTP_STARTTLS: "true"
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/db')"]
      interval: 10s
      timeout: 3s
      retries: 15

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
      NEXTAUTH_URL: https://${BRIDGE_DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      BRIDGE_DOMAIN: ${BRIDGE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.azure:/etc/caddy/Caddyfile:ro
      - bridge_azure_caddy_data:/data
      - bridge_azure_caddy_config:/config
    depends_on:
      - web

volumes:
  bridge_azure_pgdata:
  bridge_azure_caddy_data:
  bridge_azure_caddy_config:
